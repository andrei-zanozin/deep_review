proxy:
  server: "http://rb-proxy-de.bosch.com:8080"
  username: "${PROXY_USERNAME}"
  password: "${PROXY_PASSWORD}"

mcp:
  jira:
    command:
      - uv
      - run
      - --project
      - ../jira_mcp
      - ../jira_mcp/jira_mcp.py
    environment:
      JIRA_SERVER: "${JIRA_SERVER}"
      JIRA_PAT: "${JIRA_PAT}"
      PROXY_USERNAME: "${PROXY_USERNAME}"
      PROXY_PASSWORD: "${PROXY_PASSWORD}"

  bitbucket:
    command:
      - uv
      - run
      - --project
      - ../bitbucket_mcp
      - ../bitbucket_mcp/bitbucket_mcp.py
    environment:
      BITBUCKET_PAT: "${BITBUCKET_PAT}"
      PROXY_USERNAME: "${PROXY_USERNAME}"
      PROXY_PASSWORD: "${PROXY_PASSWORD}"

llm:
  base_url: "${DEEP_REVIEW_OPENAI_BASE_URL}"
  api_key: "${DEEP_REVIEW_OPENAI_API_KEY}"
  model_id: "default-model"
  # Optional USD per one million tokens. These rates are operator-maintained.
  # pricing:
  #   input_usd_per_million_tokens: "1.00"
  #   output_usd_per_million_tokens: "4.00"
  #   cache_read_input_usd_per_million_tokens: "0.25"
  parameters:
    temperature: 0

agents:
  discovery:
    use_proxy: true
  architecture_expert:
    use_proxy: true
    llm:
      model_id: "architecture-expert-model"
      parameters:
        temperature: 0
  code_polish_expert:
    use_proxy: false
    llm:
      base_url: "http://127.0.0.1:8000/v1"
      api_key: null
      model_id: "local-model"
