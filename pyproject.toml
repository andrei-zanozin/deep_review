[project]
name = "deep-review"
version = "0.1.0"
description = "Deterministic Python orchestration for evidence-based code review."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "strands-agents[openai]==1.55.1",
    "unidiff>=0.7,<1",
]

[project.scripts]
deep-review = "deep_review.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
